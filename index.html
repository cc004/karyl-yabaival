<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Unity WebGL Player | AprilGames2024</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-mobile">
      <div class="canvas-container">
        <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">AprilGames2024</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector(".canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/April2024_Web.loader.js";
      var config = {
        dataUrl: buildUrl + "/April2024_Web.data.unityweb",
        frameworkUrl: buildUrl + "/April2024_Web.framework.js.unityweb",
        codeUrl: buildUrl + "/April2024_Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Cygames",
        productName: "AprilGames2024",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // Fit the entire 16:9 game inside the visible viewport, including on
      // wide phones where sizing by width alone would crop the bottom.
      function resizeGame() {
        var viewport = window.visualViewport;
        container.style.width = (viewport ? viewport.width : window.innerWidth) + "px";
        container.style.height = (viewport ? viewport.height : window.innerHeight) + "px";
        container.style.left = (viewport ? viewport.offsetLeft : 0) + "px";
        container.style.top = (viewport ? viewport.offsetTop : 0) + "px";

        var style = window.getComputedStyle(container);
        var width = container.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
        var height = container.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
        var scale = Math.max(0, Math.min(width / 1280, height / 720));
        canvasContainer.style.width = (1280 * scale) + "px";
        canvasContainer.style.height = (720 * scale) + "px";
      }

      resizeGame();
      window.addEventListener("resize", resizeGame);
      window.addEventListener("orientationchange", resizeGame);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeGame);
        window.visualViewport.addEventListener("scroll", resizeGame);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
